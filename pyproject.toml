[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tasker-mcp-server"
version = "0.1.0"
description = "MCP Server for generating Tasker XML automation configurations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Alex" },
]
keywords = ["tasker", "mcp", "automation", "android"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]
dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2.0",
]

[project.scripts]
tasker-mcp = "tasker_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tasker_mcp"]
